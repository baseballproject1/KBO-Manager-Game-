<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>프로야구 카드게임</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<h1>⚾ 프로야구 카드게임</h1>


<!-- 팀 선택 -->

<section id="teamSection">

<h2>🏟 팀 선택</h2>

<select id="teamList">

<option value="SSG">SSG 랜더스</option>
<option value="LG">LG 트윈스</option>
<option value="삼성">삼성 라이온즈</option>
<option value="KIA">KIA 타이거즈</option>
<option value="KT">KT 위즈</option>
<option value="두산">두산 베어스</option>
<option value="롯데">롯데 자이언츠</option>
<option value="한화">한화 이글스</option>
<option value="NC">NC 다이노스</option>
<option value="키움">키움 히어로즈</option>

</select>


<button onclick="selectTeam()">
팀 선택
</button>


</section>




<!-- 유저 정보 -->

<section>

<h2>💰 내 정보</h2>


<p>
팀 :
<span id="myTeam">
없음
</span>
</p>


<p>
자금 :
<span id="money">
100억
</span>
</p>


</section>





<!-- 아이템 -->

<section>


<h2>🎫 보유 아이템</h2>


<p>
일반 뽑기권 :
<span id="normalGachaTicket">
0
</span>
</p>


<p>
고급 뽑기권 :
<span id="highGachaTicket">
0
</span>
</p>


<p>
특성 변경권 :
<span id="traitChangeTicket">
0
</span>
</p>


<p>
강화권 :
<span id="enhanceTicket">
0
</span>
</p>


<p>
하락 방지권 :
<span id="protectTicket">
0
</span>
</p>


<p>
고급 강화권 :
<span id="advancedEnhanceTicket">
0
</span>
</p>


</section>






<!-- 선수단 -->

<section>


<h2>⚾ 내 선수단</h2>


<div id="players">

</div>


</section>






<!-- 메뉴 -->

<section>


<h2>메뉴</h2>


<button onclick="openGacha()">
🎲 선수 영입
</button>



<button onclick="openShop()">
🏪 상점
</button>



<button onclick="openEnhance()">
🔨 강화
</button>



<button onclick="changeTrait()">
🔄 특성 변경
</button>



<button onclick="makeLegend()">
👑 레전드 제작
</button>



<button onclick="startMatch()">
⚾ 경기 시작
</button>


</section>








<!-- JS -->

<script src="data/players.js"></script>
<script src="data/teams.js"></script>
<script src="data/traits.js"></script>


<script src="system/save.js"></script>
<script src="system/gacha.js"></script>

<script src="system/shopItems.js"></script>
<script src="system/shop.js"></script>

<script src="system/enhance.js"></script>
<script src="system/traitChange.js"></script>

<script src="system/legend.js"></script>

<script src="system/match.js"></script>
<script src="system/reward.js"></script>


<script src="app.js"></script>


</body>

</html>
